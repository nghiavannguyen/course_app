name: course_app
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  # sub_project:
  #   path: shared
  core_theme:
    path: packages/core_theme
  core_ui:
    path: packages/core_ui
  core_services:
    path: packages/core_services
  core_network:
    path: packages/core_network
  core_utils:
    path: packages/core_utils

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  # easy_localization: ^3.0.7+1
  dio: ^5.4.0
  get_it: ^7.6.4
  hive: ^2.2.3
  json_annotation: ^4.8.0
  path_provider: ^2.0.7
  dio_smart_retry: ^7.0.1
  logger: ^2.5.0
  either_dart: ^1.0.0
  youtube_player_flutter: ^9.1.1
  # hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner:
  flutter_gen_runner:
  hive_generator: ^2.0.1
  melos: ^6.0.0

flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    image: true
    flutter_svg: true
    rive: true
    lottie: true

  # colors:
  #   inputs:
  #     - assets/color/colors.xml

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    # - assets/fonts/
