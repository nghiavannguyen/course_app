name: core_theme
description: "A new Flutter package project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.6.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/fonts/

  fonts:
    - family: poppins
      fonts:
        - asset: assets/fonts/SVN_Poppins_Regular.ttf
        - asset: assets/fonts/SVN_Poppins_SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SVN_PoppinsBold.ttf
          weight: 700
